services:
  app:
    build: .
    image: tp-wik-dps-01
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    environment:
      PORT: ${PORT:-3000}
      INSTANCE_ID: ${INSTANCE_ID:-}
    restart: unless-stopped
    # No healthcheck: the `scratch` image is empty (no curl/shell to exec).
    # The app is a static binary; liveness is handled by `restart` above.
