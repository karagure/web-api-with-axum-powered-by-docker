services:
  app:
    build:
      context: .
      # Use the optimized, source-free multi-stage image (scratch, ~2 MB, 0 CVE).
      # Swap to "Dockerfile" to build the single-stage variant instead.
      dockerfile: Dockerfile.multistage
    image: tp-wik-dps-01
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    environment:
      PORT: ${PORT:-3000}
      INSTANCE_ID: ${INSTANCE_ID:-}
    restart: unless-stopped
    # No healthcheck: the `scratch` image is empty (no curl/shell to exec).
    # The app is a static binary; liveness is handled by `restart` above.
